name: Validate TrueLens
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --check app.js && node --check metadata.js && node --check png-metadata.js && node --check origin-trace.js && node --check signature.js
      - run: node tests/metadata.test.cjs
